<style>
:root{
  --ink:#3B2418;
  --bg:#FFF1D6;
  --card:#FFFDF5;
  --sand:#5A3A28;
  --sand-dim:#8A6A52;
  --pink:#F2D08A;
  --pink-deep:#B5432A;
  --pink-btn:#C8492B;
  --pink-btn-dim:#8F3220;
  --lilac:#C9DBEA;
  --lilac-deep:#2F5D8A;
  --lilac-btn:#3A6EA5;
  --lilac-btn-dim:#27506F;
  --blue:#D3E8DF;
  --blue-deep:#2F7D6B;
  --blue-btn:#2F7D6B;
  --blue-btn-dim:#1F5A4C;
  --amber:#FFD966;
  --amber-deep:#C98A12;
  --line:rgba(181,67,42,0.18);
  --radius:26px;
  --radius-lg:36px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--sand);
  font-family:'Nunito',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{
  font-family:'Baloo 2',sans-serif;
  color:var(--ink);
  line-height:1.15;
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--pink-btn-dim);color:#fff;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}

.screen{min-height:100vh;width:100%;}
.hide{display:none !important;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,241,214,0.94);
  backdrop-filter:blur(8px);
  border-bottom:0;
}
.topbar::after{content:"";display:block;height:9px;background:linear-gradient(#C8492B 0 3px,#F2B632 3px 6px,#2F5D8A 6px 9px);}
.topbar-inner{
  max-width:720px;margin:0 auto;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{font-family:'Bowlby One','Baloo 2';font-size:19px;font-weight:400;letter-spacing:.5px;color:var(--pink-deep);display:flex;align-items:center;gap:6px;}
.brand::before{content:none;}
.brand svg{width:38px;height:30px;flex-shrink:0;}
.back-btn{
  background:var(--card);border:2px solid var(--pink);color:var(--ink);
  padding:8px 16px;font-size:15px;font-weight:700;border-radius:30px;
  display:flex;align-items:center;gap:6px;
}
.back-btn:active{transform:scale(0.95);}

/* ---------- home ---------- */
.hero{max-width:720px;margin:0 auto;padding:34px 20px 6px;position:relative;}
.hero h1{font-size:34px;margin-bottom:6px;}
.hero h1::after{content:" ★";color:var(--amber-deep);}
.hero-mascot{position:absolute;right:16px;top:-6px;width:78px;transform:rotate(-4deg);}
.hero-mascot svg{width:100%;height:auto;display:block;}
.hero h1{max-width:calc(100% - 100px);}
.hero h1{font-family:'Bowlby One','Baloo 2';font-weight:400;letter-spacing:.3px;}
.hero p{font-size:16px;color:var(--sand-dim);font-weight:700;margin:0;}


.footer-note{
  text-align:center;padding:14px 20px 50px;font-size:13.5px;color:var(--sand-dim);font-weight:700;
}

/* ---------- subject page ---------- */
.subj-header{max-width:720px;margin:0 auto;padding:26px 20px 0;}
.subj-header h1{font-size:29px;margin-bottom:6px;}
.subj-header .meta{font-size:14.5px;color:var(--sand-dim);font-weight:700;}

.topic-list{max-width:720px;margin:0 auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:12px;}
.topic-row{
  background:var(--card);border:2.5px solid var(--pink);
  border-radius:var(--radius);padding:15px 17px;
  display:flex;align-items:center;gap:14px;
  text-align:left;
}
.topic-row:active{transform:scale(0.98);}
.topic-row .tnum-badge{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2';font-weight:700;font-size:14px;
  background:var(--bg);border:2px solid var(--pink);color:var(--pink-deep);
}
.topic-row.done .tnum-badge{background:var(--blue-btn);border-color:var(--blue-btn-dim);color:#fff;}
.topic-row .ttxt{flex:1;min-width:0;}
.topic-row .tt-name{font-size:16px;font-weight:800;color:var(--ink);}
.topic-row .tt-sub{font-size:13px;color:var(--sand-dim);margin-top:2px;font-weight:600;}
.topic-row .tarrow{color:var(--pink-deep);font-size:18px;flex-shrink:0;}

.timeline-wrap{max-width:720px;margin:0 auto;padding:18px 20px 0;}
.timeline-label{font-size:13px;font-weight:700;color:var(--sand-dim);margin-bottom:10px;}
.timeline{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.timeline::-webkit-scrollbar{height:4px;}
.timeline::-webkit-scrollbar-thumb{background:var(--pink);border-radius:4px;}
.tl-stop{
  flex-shrink:0;min-width:130px;
  background:var(--card);border:2px solid var(--lilac);
  border-radius:18px;padding:11px 13px;
}
.tl-stop .tl-year{font-family:'Baloo 2';font-weight:700;font-size:13px;}
.tl-stop .tl-title{font-size:13px;font-weight:700;margin-top:3px;line-height:1.3;color:var(--ink);}
.tl-connector{flex-shrink:0;width:12px;display:flex;align-items:center;justify-content:center;color:var(--lilac-deep);font-size:13px;}

.practice-link{
  max-width:720px;margin:18px auto 50px;padding:0 20px;
  display:flex;flex-direction:column;gap:10px;
}
.practice-link button{
  width:100%;padding:18px;border-radius:var(--radius-lg);border:none;
  background:var(--pink-btn);color:#fff;font-weight:800;font-size:16.5px;
  box-shadow:0 4px 0 var(--pink-btn-dim);
}
.practice-link button.practice-link-extra{
  background:var(--card);border:2.5px solid var(--lilac);color:var(--lilac-deep);
  font-size:14.5px;padding:15px;box-shadow:none;
}

/* ---------- topic study page ---------- */
.study-tabs{
  max-width:720px;margin:0 auto;display:flex;gap:8px;padding:18px 20px 0;
}
.study-tab{
  flex:1;padding:12px 8px;border-radius:20px;border:none;
  background:var(--card);border:2px solid var(--lilac);color:var(--sand-dim);font-weight:700;font-size:14px;
}
.study-tab.active{background:var(--lilac-btn);border-color:var(--lilac-btn-dim);color:#fff;}

.study-body{max-width:680px;margin:0 auto;padding:22px 20px 60px;}

/* slides — read as a document, with a soft kawaii card */
.slide-counter{font-size:13.5px;color:var(--pink-deep);font-weight:700;margin-bottom:10px;}
.slide-card{background:var(--card);border:3px solid var(--pink);border-radius:var(--radius-lg);padding:24px 22px;}
.slide-card h3{font-size:22px;margin-bottom:14px;}
.slide-card .slide-body{font-size:17px;line-height:1.7;color:var(--sand);font-weight:500;}
.slide-card .slide-body b{color:var(--blue-deep);font-weight:800;}
.slide-card .slide-body ul{padding-left:22px;margin:10px 0;}
.slide-card .slide-body li{margin-bottom:8px;}
.slide-card .slide-tip{
  margin-top:18px;padding:14px 16px;background:var(--amber);
  border-radius:18px;font-size:15px;color:var(--ink);line-height:1.55;font-weight:600;
}
.slide-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px;}
.slide-btn{
  background:var(--card);border:2.5px solid var(--pink);
  color:var(--pink-deep);width:46px;height:46px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;

}
.slide-btn:disabled{opacity:0.25;}
.slide-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.slide-dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.slide-dot.on{background:var(--pink-btn);}

/* video */
.video-frame-wrap{
  border-radius:var(--radius-lg);overflow:hidden;background:#000;
  position:relative;width:100%;aspect-ratio:16/9;margin-bottom:14px;
  border:3px solid var(--pink);
}
.video-frame-wrap iframe{width:100%;height:100%;border:0;display:block;}
.video-note{font-size:15px;color:var(--sand);line-height:1.55;font-weight:600;}
.video-fallback-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  font-size:14.5px;font-weight:700;color:var(--pink-deep);
  border-bottom:2px solid currentColor;padding-bottom:2px;
}

/* flashcards */

const SUBJECT_ORDER = ["ciencias","geografia","historia","portugues","matematica"];

const state = {
  route: { view: "home" },
  progress: loadProgress(),
  calTab: { tri: "t3", prova: "parciais-t3" },
};

function loadProgress(){
  try{
    return {}; // in-memory only per session (no localStorage per artifact rules)
  }catch(e){ return {}; }
}

function topicKey(subjId, topicId){ return subjId+"::"+topicId; }

function isTopicDone(subjId, topicId){
  return !!state.progress[topicKey(subjId,topicId)];
}
function markTopicDone(subjId, topicId){
  state.progress[topicKey(subjId,topicId)] = true;
}
function subjectProgressPct(subjId){
  const subj = window.SUBJECTS[subjId];
  if(!subj || !subj.topicos.length) return 0;
  const done = subj.topicos.filter(t=>isTopicDone(subjId,t.id)).length;
  return Math.round((done/subj.topicos.length)*100);
}

/* ---------------- ROUTER ---------------- */
function navigate(route){
  state.route = route;
  render();
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById("app");
  const r = state.route;
  if(r.view === "home") app.innerHTML = renderHome();
  else if(r.view === "subject") app.innerHTML = renderSubject(r.subjId);
  else if(r.view === "study") app.innerHTML = renderStudy(r.subjId, r.topicId, r.tab || "video");
  else if(r.view === "quiz") app.innerHTML = renderQuizIntro(r.subjId, r.extra);
  else if(r.view === "quiz-run") app.innerHTML = renderQuizRun(r.subjId);
  else if(r.view === "quiz-results") app.innerHTML = renderQuizResults(r.subjId);
  attachHandlers();
}

// Alguns módulos têm tópicos/questões marcados com provas: ["parciais"],
// ["abrangentes"] ou ["parciais","abrangentes"] (quando o mesmo assunto é
// cobrado nas duas provas do trimestre). Quando existem essas marcações,
// filtramos pelo que está selecionado em state.calTab.prova. Módulos sem
// marcação (ainda) continuam mostrando tudo, como sempre.
function getVisibleTopicos(s){
  const hasProvaTags = s.topicos.some(t=>t.provas);
  if(!hasProvaTags) return s.topicos;
  return s.topicos.filter(t=>t.provas && t.provas.includes(state.calTab.prova));
}
function getVisibleQuestoes(s){
  const hasProvaTags = s.questoes.some(q=>q.provas);
  if(!hasProvaTags) return s.questoes;
  return s.questoes.filter(q=>q.provas && q.provas.includes(state.calTab.prova));
}
function getVisibleExtras(s){
  if(!s.questoesExtra) return [];
  return s.questoesExtra.filter(q=>(q.provas || ["parciais","abrangentes"]).includes(state.calTab.prova));
}
function getVisibleLinhaDoTempo(s){
  if(!s.linhaDoTempo) return [];
  const hasProvaTags = s.linhaDoTempo.some(e=>e.provas);
  if(!hasProvaTags) return s.linhaDoTempo;
  return s.linhaDoTempo.filter(e=>e.provas && e.provas.includes(state.calTab.prova));
}

function renderSubject(subjId){
  const s = window.SUBJECTS[subjId];
  const isHistoria = subjId === "historia";
  const topicosVisiveis = getVisibleTopicos(s);
  const totalQ = getVisibleQuestoes(s).length;

  let timelineBlock = "";
  const linhaVisivel = getVisibleLinhaDoTempo(s);
  if(isHistoria && linhaVisivel.length){
    const tlItems = linhaVisivel.map((e,i)=>`
      <div class="tl-stop">
        <div class="tl-year" style="color:${s.corBtn}">${e.ano}</div>
        <div class="tl-title">${e.titulo}</div>
      </div>
      ${i < linhaVisivel.length-1 ? '<div class="tl-connector">'+ARROW_RIGHT+'</div>' : ""}
    `).join("");
    timelineBlock = `
      <div class="timeline-wrap">
        <div class="timeline-label">Linha do tempo</div>
        <div class="timeline">${tlItems}</div>
      </div>
    `;
  }

  const topicRows = topicosVisiveis.map((t,i)=>{
    const done = isTopicDone(subjId, t.id);
    return `
      <button class="topic-row ${done?'done':''}" data-action="open-study" data-subj="${subjId}" data-topic="${t.id}">
        <div class="tnum-badge">${done?'✓':(i+1)}</div>
        <div class="ttxt">
          <div class="tt-name">${t.titulo}</div>
          <div class="tt-sub">${t.subtitulo}</div>
        </div>
        <div class="tarrow">${ARROW_RIGHT}</div>
      </button>
    `;
  }).join("");

  return `
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" data-action="go-home">${ARROW_LEFT} Início</button>
      </div>
    </div>
    <div class="screen">
      <div class="subj-header">
        <h1>${s.icone} ${s.nome}</h1>
        <div class="meta">${getSubjectDateLabel(subjId, s.data)}</div>
      </div>

      ${timelineBlock}

      <div class="topic-list">
        ${topicRows}
      </div>

      <div class="practice-link">
        <button data-action="open-quiz" data-subj="${subjId}">Praticar — ${totalQ} questões</button>
        ${getVisibleExtras(s).length ? `<button class="practice-link-extra" data-action="open-quiz" data-subj="${subjId}" data-extra="1">+ ${getVisibleExtras(s).length} questões</button>` : ""}
      </div>
    </div>
  `;
}

const studyLocalState = { slideIdx:0, flashIdx:0, flashFlipped:false };

function renderStudy(subjId, topicId, tab){
  const s = window.SUBJECTS[subjId];
  const t = s.topicos.find(x=>x.id===topicId);
  const done = isTopicDone(subjId, topicId);
  const hasAtv = t.atividades && t.atividades.length;

  const tabsHtml = `
    <div class="study-tabs">
      <button class="study-tab ${tab==='video'?'active':''}" data-action="study-tab" data-subj="${subjId}" data-topic="${topicId}" data-tab="video">🎬 Vídeo</button>
      <button class="study-tab ${tab==='slides'?'active':''}" data-action="study-tab" data-subj="${subjId}" data-topic="${topicId}" data-tab="slides">📖 Slides</button>
      <button class="study-tab ${tab==='flash'?'active':''}" data-action="study-tab" data-subj="${subjId}" data-topic="${topicId}" data-tab="flash">🗂️ Flashcards</button>
      ${hasAtv ? `<button class="study-tab ${tab==='atividades'?'active':''}" data-action="study-tab" data-subj="${subjId}" data-topic="${topicId}" data-tab="atividades">🎯 Atividades</button>` : ""}
    </div>
  `;

  let body = "";
  if(tab === "slides") body = renderSlides(t);
  else if(tab === "video") body = renderVideo(t);
  else if(tab === "flash") body = renderFlashcards(t);
  else if(tab === "atividades") body = renderAtividades(t);

  return `
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" data-action="open-subject" data-subj="${subjId}">${ARROW_LEFT} ${s.nome}</button>
      </div>
    </div>
    <div class="screen">
      <div class="subj-header" style="padding-top:20px;">
        <h1 style="font-size:22px;">${t.titulo}</h1>
        <div class="meta">${t.subtitulo}</div>
      </div>
      ${tabsHtml}
      <div class="study-body">
        ${body}
        <button class="mark-done-btn ${done?'done':''}" data-action="toggle-done" data-subj="${subjId}" data-topic="${topicId}">
          ${done ? "✓ Tópico concluído" : "Marcar como concluído"}
        </button>
      </div>
    </div>
  `;
}

function renderSlides(t){
  const idx = Math.min(studyLocalState.slideIdx, t.slides.length-1);
  const sl = t.slides[idx];
  const dots = t.slides.map((_,i)=>`<div class="slide-dot ${i===idx?'on':''}"></div>`).join("");
  return `
    <div class="slide-counter">SLIDE ${idx+1} DE ${t.slides.length}</div>
    <div class="slide-card">
      <div class="slide-ic">${sl.icone}</div>
      <h3>${sl.titulo}</h3>
      <div class="slide-body">${sl.corpo}</div>

      <button class="slide-btn" data-action="slide-prev" ${idx===0?'disabled':''}>${ARROW_LEFT}</button>

      <button class="slide-btn" data-action="slide-next" ${idx===t.slides.length-1?'disabled':''}>${ARROW_RIGHT}</button>

   ATIVIDADES (mini-exercício, simulador, jogo)
   ============================================================ */
const atvState = {
  activeIdx: null,       // índice da atividade aberta dentro de t.atividades, ou null = tela de escolha
  rodada: 0,             // rodada atual (para tipos baseados em rodadas)
  answered: false,
  selected: null,        // resposta escolhida ('a'/'b'/'empate') para tipo compare
  inputValue: "",        // valor de texto/número digitado pelo usuário
  ordem: null,           // array de strings na ordem atual (tipo ordenar)
  qvlValue: "",          // valor digitado no simulador QVL
  conversorValue: "",    // valor digitado no conversor
  conversorOpIdx: 0,     // índice da opção de conversão escolhida
  algoritmoVals: {},     // respostas digitadas no algoritmo {linha1, linha2, total}
  arrayLinhas: 3,
  arrayColunas: 3,
  acertos: 0,
  totalFeitas: 0
};

function resetAtvRodadaState(){
  atvState.answered = false;
  atvState.selected = null;
  atvState.inputValue = "";
  atvState.algoritmoVals = {};
}

function openAtividade(idx){
  atvState.activeIdx = idx;
  atvState.rodada = 0;
  atvState.acertos = 0;
  atvState.totalFeitas = 0;
  resetAtvRodadaState();
  const t = currentStudyTopic();
  const atv = t.atividades[idx];
  if(atv.tipo === "ordenar"){
    const conjunto = atv.conjuntos[0];
    atvState.ordem = shuffleArray(conjunto.slice());
  }
  if(atv.tipo === "array"){
    atvState.arrayLinhas = 3;
    atvState.arrayColunas = 3;
  }
  render();
}

function closeAtividade(){
  atvState.activeIdx = null;
  render();
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function currentStudyTopic(){
  const r = state.route;
  const s = window.SUBJECTS[r.subjId];
  return s.topicos.find(x=>x.id===r.topicId);
}

function renderAtividades(t){
  if(atvState.activeIdx === null){
    const cards = t.atividades.map((a,i)=>`
      <button class="atv-card" data-action="atv-open" data-idx="${i}">
        <div class="atv-ic">${a.icone}</div>
        <div class="atv-txt">
          <div class="atv-name">${a.titulo}</div>
          <div class="atv-desc">${a.desc}</div>
        </div>
        <div class="atv-arrow">${ARROW_RIGHT}</div>
      </button>
    `).join("");
    return `<div class="atv-picker">${cards}</div>`;
  }

  const atv = t.atividades[atvState.activeIdx];
  const backBtn = `<button class="atv-back" data-action="atv-close">${ARROW_LEFT} Voltar às atividades</button>`;

  let inner = "";
  if(atv.tipo === "compare") inner = renderAtvCompare(atv);
  else if(atv.tipo === "qvl") inner = renderAtvQvl(atv);
  else if(atv.tipo === "ordenar") inner = renderAtvOrdenar(atv);
  else if(atv.tipo === "somasub") inner = renderAtvSomaSub(atv);
  else if(atv.tipo === "problema-loja") inner = renderAtvProblema(atv);
  else if(atv.tipo === "conversor") inner = renderAtvConversor(atv);
  else if(atv.tipo === "algoritmo") inner = renderAtvAlgoritmo(atv);
  else if(atv.tipo === "array") inner = renderAtvArray(atv);
  else if(atv.tipo === "solidos-elementos") inner = renderAtvSolidos(atv);

  return `${backBtn}<div class="atv-box">${inner}</div>`;
}

/* ---------- compare: clique no maior decimal ---------- */
function renderAtvCompare(atv){
  const total = atv.rodadas.length;
  const r = atv.rodadas[atvState.rodada % total];
  const answered = atvState.answered;
  let clsA = "", clsB = "";
  if(answered){
    if(r.maior === "a"){ clsA = "correct"; if(atvState.selected==="b") clsB="wrong"; }
    else if(r.maior === "b"){ clsB = "correct"; if(atvState.selected==="a") clsA="wrong"; }
    else { clsA = "correct"; clsB = "correct"; }
  }
  let feedback = "";
  if(answered){
    const certo = atvState.selected === r.maior || (r.maior==="empate");
    const msg = r.maior === "empate"
      ? `Os dois números são IGUAIS! ${r.a} e ${r.b} representam o mesmo valor — só têm zeros extras.`
      : `O maior é ${r.maior==='a'?r.a:r.b}. Iguale as casas decimais e compare dígito por dígito, da esquerda pra direita.`;
    feedback = `<div class="atv-feedback ${certo?'ok':'bad'}">${certo?'✅ Isso! ':'❌ Quase! '}${msg}</div>
      <button class="atv-next-btn" data-action="atv-next-round">${atvState.rodada < total-1 ? 'Próxima rodada' : 'Recomeçar'} ${ARROW_RIGHT}</button>`;
  }
  return `
    <h3>${atv.titulo}</h3>
    <div class="atv-instr">${atv.instrucao}</div>
    <div class="atv-progress">Rodada ${atvState.rodada+1} de ${total} · ✅ ${atvState.acertos}/${atvState.totalFeitas}</div>
    <div class="atv-compare-row">
      <div class="atv-compare-num ${clsA}" data-action="atv-compare-pick" data-pick="a" ${answered?'style="pointer-events:none"':''}>${r.a}</div>
      <div class="atv-compare-vs">vs</div>
      <div class="atv-compare-num ${clsB}" data-action="atv-compare-pick" data-pick="b" ${answered?'style="pointer-events:none"':''}>${r.b}</div>
    </div>
    ${!answered ? `<div class="atv-instr" style="text-align:center;">Toque no que for maior. Se forem iguais, toque nos dois ao mesmo tempo é difícil — escolha qualquer um e a Lumi te explica! 😉</div>` : ""}
    ${feedback}
  `;
}

/* ---------- qvl: quadro de valor de lugar ---------- */
function renderAtvQvl(atv){
  const raw = atvState.qvlValue || "";
  const parts = raw.split(",");
  const inteira = (parts[0]||"").replace(/\D/g,"").slice(-3).padStart(3," ");
  const decimal = (parts[1]||"").replace(/\D/g,"").slice(0,3).padEnd(3," ");
  const digitsInt = inteira.split("");
  const digitsDec = decimal.split("");
  const cells = atv.colunas.map((label,i)=>{
    const isInt = i < 3;
    const d = isInt ? digitsInt[i] : digitsDec[i-3];
    const empty = !d || d===" ";
    return `<div class="atv-qvl-cell ${empty?'empty':''}"><div class="qvl-label">${label}</div><div class="qvl-digit">${empty?'·':d}</div></div>`;
  });
  cells.splice(3, 0, `<div class="atv-qvl-divider"></div>`);
  return `
    <h3>${atv.titulo}</h3>
    <div class="atv-instr">${atv.instrucao}</div>
    <input class="atv-qvl-input" type="text" inputmode="decimal" placeholder="Ex: 23,156" value="${raw}" data-action-input="qvl" />
    <div class="atv-qvl-table">${cells.join("")}</div>
  `;
}

/* ---------- ordenar: organizar decimais ---------- */
function renderAtvOrdenar(atv){
  const conjuntoIdx = atvState.rodada % atv.conjuntos.length;
  if(!atvState.ordem) atvState.ordem = shuffleArray(atv.conjuntos[conjuntoIdx].slice());
  const correta = atv.conjuntos[conjuntoIdx].slice().sort((a,b)=>parseFloat(a.replace(",","."))-parseFloat(b.replace(",",".")));
  const isCorrect = atvState.answered && JSON.stringify(atvState.ordem) === JSON.stringify(correta);

  const items = atvState.ordem.map((val,i)=>`
    <div class="atv-order-item">
      <div class="oi-pos">${i+1}</div>
      <div style="flex:1;">${val}</div>
      <div class="atv-order-controls">
        <button data-action="atv-order-up" data-i="${i}" ${i===0?'disabled':''}>▲</button>
        <button data-action="atv-order-down" data-i="${i}" ${i===atvState.ordem.length-1?'disabled':''}>▼</button>
      </div>
    </div>
  `).join("");

  let feedback = "";
  if(atvState.answered){
    feedback = `<div class="atv-feedback ${isCorrect?'ok':'bad'}">
        ${isCorrect ? '✅ Isso! Ordem crescente perfeita!' : '❌ Ainda não — a ordem certa é: '+correta.join(' < ')}
      </div>
      <button class="atv-next-btn" data-action="atv-next-round">${atvState.rodada < atv.conjuntos.length-1 ? 'Próximo conjunto' : 'Recomeçar'} ${ARROW_RIGHT}</button>`;
  }

  return `
    <h3>${atv.titulo}</h3>
    <div class="atv-instr">${atv.instrucao}</div>
    <div class="atv-progress">Conjunto ${conjuntoIdx+1} de ${atv.conjuntos.length}</div>
    <div class="atv-order-list">${items}</div>
    ${!atvState.answered ? `<button class="atv-check-btn" data-action="atv-check-order">Conferir ordem</button>` : feedback}
  `;
}

function normalizeNum(str){
  if(str===undefined || str===null) return "";
  return String(str).trim().replace(",", ".").replace(/^0+(?=\d)/, "");
}

/* ============================================================
   QUIZ — INTRO / RUN / RESULTS
   ============================================================ */
const quizState = {
  subjId:null, idx:0, answers:[], selected:null, answered:false,
  startTime:null, totalSeconds:0, timerInterval:null,
  activeQuestoes:null, usedExtra:false, isReview:false,
};

function renderQuizIntro(subjId, extra){
  const s = window.SUBJECTS[subjId];
  const hasExtra = extra && getVisibleExtras(s).length;
  const totalQ = hasExtra ? getVisibleQuestoes(s).length + getVisibleExtras(s).length : getVisibleQuestoes(s).length;
  const minutos = calcQuizMinutes(totalQ);
  return `
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" data-action="open-subject" data-subj="${subjId}">${ARROW_LEFT} ${s.nome}</button>
      </div>
    </div>
    <div class="screen">
      <div class="results-wrap">
        <div style="font-size:44px;margin-bottom:14px;">${s.icone}</div>
        <h2>Praticar ${s.nome}</h2>
        <p>${totalQ} questões · ${minutos} min sugeridos</p>
        <div class="results-actions">
          <button class="ra-primary" data-action="start-quiz" data-subj="${subjId}" data-extra="${hasExtra?1:0}">Começar prática</button>
          <button class="ra-secondary" data-action="open-subject" data-subj="${subjId}">Voltar</button>
        </div>
      </div>
    </div>
  `;
}

// Tempo sugerido escala com a quantidade de questões: 60 min para 100 questões (0,6 min/questão).
// Tempo mínimo de 5 min para práticas curtas.
function calcQuizMinutes(qtdQuestoes){
  return Math.max(5, Math.round(qtdQuestoes * 0.6));
}

function startQuiz(subjId, includeExtra){
  const s = window.SUBJECTS[subjId];
  quizState.subjId = subjId;
  quizState.idx = 0;
  quizState.answers = [];
  quizState.selected = null;
  quizState.answered = false;
  const baseQuestoes = getVisibleQuestoes(s);
  quizState.activeQuestoes = (includeExtra && getVisibleExtras(s).length) ? baseQuestoes.concat(getVisibleExtras(s)) : baseQuestoes.slice();
  quizState.usedExtra = !!(includeExtra && getVisibleExtras(s).length);
  quizState.isReview = false;
  quizState.wrongQuestoes = [];
  quizState.totalSeconds = calcQuizMinutes(quizState.activeQuestoes.length)*60;
  quizState.elapsed = 0;
  navigate({view:"quiz-run", subjId});
  startTimer();
}

function startReviewQuiz(subjId, questoes){
  const s = window.SUBJECTS[subjId];
  quizState.subjId = subjId;
  quizState.idx = 0;
  quizState.answers = [];
  quizState.selected = null;
  quizState.answered = false;
  quizState.activeQuestoes = questoes.slice();
  quizState.usedExtra = false;
  quizState.isReview = true;
  quizState.wrongQuestoes = [];
  quizState.totalSeconds = calcQuizMinutes(quizState.activeQuestoes.length)*60;
  quizState.elapsed = 0;
  navigate({view:"quiz-run", subjId});
  startTimer();
}

function startTimer(){
  stopTimer();
  quizState.timerInterval = setInterval(()=>{
    quizState.elapsed += 1;
    updateTimeBar();
  }, 1000);
}
function stopTimer(){
  if(quizState.timerInterval) clearInterval(quizState.timerInterval);
  quizState.timerInterval = null;
}
function updateTimeBar(){
  const fill = document.querySelector(".time-fill");
  const label = document.querySelector(".time-label");
  if(!fill || !label) return;
  const pct = Math.max(0, 100 - (quizState.elapsed/quizState.totalSeconds)*100);
  fill.style.width = pct+"%";
  if(pct < 25) fill.style.background = "var(--amber)";
  if(pct <= 0) fill.style.background = "var(--pink-btn)";
  const remaining = Math.max(0, quizState.totalSeconds - quizState.elapsed);
  const mm = Math.floor(remaining/60);
  const ss = remaining%60;
  label.textContent = remaining>0 ? `${mm}:${String(ss).padStart(2,'0')} restantes (tempo total da prática)` : "Tempo sugerido encerrado — siga no seu ritmo";
}

function renderQuizRun(subjId){
  const s = window.SUBJECTS[subjId];
  const lista = quizState.activeQuestoes || s.questoes;
  const q = lista[quizState.idx];
  const total = lista.length;
  const pctElapsed = Math.max(0, 100 - (quizState.elapsed/quizState.totalSeconds)*100);

  const optsHtml = q.opcoes.map((op,i)=>{
    let cls = "";
    let disabled = "";
    if(quizState.answered){
      disabled = "disabled";
      if(i === q.correta) cls = "correct";
      else if(i === quizState.selected) cls = "wrong";
    }
    return `
      <button class="quiz-opt ${cls}" data-action="select-opt" data-i="${i}" ${disabled}>
        <span class="opt-letter">${String.fromCharCode(65+i)}</span>
        <span>${op}</span>
      </button>
    `;
  }).join("");

  let explainHtml = "";
  if(quizState.answered){
    const wasWrong = quizState.selected !== q.correta;
    explainHtml = `
      <div class="quiz-explain ${wasWrong?'wrongbox':''}">
        ${wasWrong ? "❌ Quase! " : "✅ Isso! "}${q.explicacao}
      </div>
      <button class="quiz-next-btn" data-action="next-question" data-subj="${subjId}">
        ${quizState.idx < total-1 ? "Próxima questão "+ARROW_RIGHT : "Ver resultado "+ARROW_RIGHT}
      </button>
    `;
  }

  return `
    <div class="quiz-topbar">
      <div class="quiz-toprow">
        <button class="back-btn" data-action="exit-quiz" data-subj="${subjId}">${ARROW_LEFT} Sair</button>
        <div class="quiz-progress-txt">${quizState.isReview ? '🔁 Revisão · ' : ''}${quizState.idx+1} / ${total}</div>
      </div>
      <div class="time-track"><div class="time-fill" style="width:${pctElapsed}%"></div></div>
      <div class="time-label"></div>
    </div>
    <div class="screen">
      <div class="quiz-body">
        <div class="quiz-qnum">QUESTÃO ${quizState.idx+1}</div>
        <div class="quiz-question">${q.pergunta}</div>
        <div class="quiz-options">${optsHtml}</div>
        ${explainHtml}
      </div>
    </div>
  `;
}

function selectOption(i){
  if(quizState.answered) return;
  const s = window.SUBJECTS[quizState.subjId];
  const lista = quizState.activeQuestoes || s.questoes;
  const q = lista[quizState.idx];
  quizState.selected = i;
  quizState.answered = true;
  quizState.answers.push(i === q.correta);
  render();
  updateTimeBar();
}

function nextQuestion(){
  const s = window.SUBJECTS[quizState.subjId];
  const lista = quizState.activeQuestoes || s.questoes;
  if(quizState.idx < lista.length-1){
    quizState.idx += 1;
    quizState.selected = null;
    quizState.answered = false;
    render();
    updateTimeBar();
  } else {
    stopTimer();
    quizState.wrongQuestoes = lista.filter((q,i)=>quizState.answers[i] === false);
    navigate({view:"quiz-results", subjId: quizState.subjId});
  }
}

function renderQuizResults(subjId){
  const s = window.SUBJECTS[subjId];
  const correct = quizState.answers.filter(Boolean).length;
  const total = quizState.answers.length;
  const pct = Math.round((correct/total)*100);
  const wrongCount = (quizState.wrongQuestoes || []).length;
  let msg = "Continue treinando, você vai destravar isso.";
  if(pct >= 80) msg = "Excelente! Você dominou esse conteúdo.";
  else if(pct >= 60) msg = "Muito bom! Só alguns detalhes pra ajustar.";
  else if(pct >= 40) msg = "Bom começo — revise os slides e tente de novo.";
  const titlePrefix = quizState.isReview ? "Revisão: " : "";

  const reviewBtn = wrongCount > 0 ? `
        <button class="ra-secondary" data-action="review-wrong" data-subj="${subjId}">
          Revisar ${wrongCount} quest${wrongCount>1?'ões':'ão'} errada${wrongCount>1?'s':''}
        </button>` : "";

  return `
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" data-action="open-subject" data-subj="${subjId}">${ARROW_LEFT} ${s.nome}</button>
      </div>
    </div>
    <div class="screen">
      <div class="results-wrap">
        <div class="results-ring" style="border-color:${pct>=60?'var(--blue-btn)':'var(--pink-btn)'}">
          <div class="rscore">${correct}/${total}</div>
          <div class="rtotal">acertos</div>
        </div>
        <h2>${titlePrefix}${pct}% de aproveitamento</h2>
        <p>${msg}</p>
        <div class="results-actions">
          ${reviewBtn}
          <button class="ra-primary" data-action="start-quiz" data-subj="${subjId}">Tentar de novo</button>
          <button class="ra-secondary" data-action="open-subject" data-subj="${subjId}">Voltar para ${s.nome}</button>
          <button class="ra-secondary" data-action="go-home">Ir para o início</button>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick = (e)=>{
      const action = el.dataset.action;
      const subj = el.dataset.subj;
      const topic = el.dataset.topic;

      if(action === "go-home") navigate({view:"home"});
      else if(action === "cal-tri"){
        state.calTab.tri = el.dataset.tri;
        const tri = currentTri();
        if(tri.provas && tri.provas.length) state.calTab.prova = tri.provas[0].id;
        render();
      }
      else if(action === "cal-prova"){ state.calTab.prova = el.dataset.prova; render(); }
      else if(action === "open-subject"){ studyLocalState.slideIdx=0; studyLocalState.flashIdx=0; studyLocalState.flashFlipped=false; navigate({view:"subject", subjId:subj}); }
      else if(action === "open-study"){ studyLocalState.slideIdx=0; studyLocalState.flashIdx=0; studyLocalState.flashFlipped=false; atvState.activeIdx=null; navigate({view:"study", subjId:subj, topicId:topic, tab:"video"}); }
      else if(action === "study-tab"){ if(el.dataset.tab !== "atividades") atvState.activeIdx=null; navigate({view:"study", subjId:subj, topicId:topic, tab:el.dataset.tab}); }
      else if(action === "toggle-done"){
        if(isTopicDone(subj, topic)){
          delete state.progress[topicKey(subj,topic)];
        } else {
          markTopicDone(subj, topic);
        }
        render();
      }
      else if(action === "slide-prev"){ studyLocalState.slideIdx = Math.max(0, studyLocalState.slideIdx-1); render(); }
      else if(action === "slide-next"){ studyLocalState.slideIdx += 1; render(); }
      else if(action === "flash-flip"){ studyLocalState.flashFlipped = !studyLocalState.flashFlipped; render(); }
      else if(action === "flash-prev"){ studyLocalState.flashIdx = Math.max(0, studyLocalState.flashIdx-1); studyLocalState.flashFlipped=false; render(); }
      else if(action === "flash-next"){ studyLocalState.flashIdx += 1; studyLocalState.flashFlipped=false; render(); }
      else if(action === "open-quiz") navigate({view:"quiz", subjId:subj, extra: el.dataset.extra === "1"});
      else if(action === "start-quiz") startQuiz(subj, el.dataset.extra === "1");
      else if(action === "review-wrong") startReviewQuiz(subj, quizState.wrongQuestoes || []);
      else if(action === "exit-quiz"){ stopTimer(); navigate({view:"subject", subjId:subj}); }
      else if(action === "select-opt") selectOption(parseInt(el.dataset.i,10));
      else if(action === "next-question") nextQuestion();
      else if(action === "atv-open") openAtividade(parseInt(el.dataset.idx,10));
      else if(action === "atv-close") closeAtividade();
      else if(action === "atv-compare-pick"){
        if(atvState.answered) return;
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const r = atv.rodadas[atvState.rodada % atv.rodadas.length];
        atvState.selected = el.dataset.pick;
        atvState.answered = true;
        atvState.totalFeitas += 1;
        if(atvState.selected === r.maior || r.maior === "empate") atvState.acertos += 1;
        render();
      }
      else if(action === "atv-next-round"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const totalRodadas = atv.rodadas ? atv.rodadas.length : (atv.conjuntos ? atv.conjuntos.length : (atv.solidos ? atv.solidos.length : 1));
        atvState.rodada = (atvState.rodada + 1) % totalRodadas;
        resetAtvRodadaState();
        if(atv.tipo === "ordenar"){
          const conjunto = atv.conjuntos[atvState.rodada % atv.conjuntos.length];
          atvState.ordem = shuffleArray(conjunto.slice());
        }
        render();
      }
      else if(action === "atv-check-order"){
        atvState.answered = true;
        render();
      }
      else if(action === "atv-order-up"){
        const i = parseInt(el.dataset.i,10);
        if(i>0){ const a=atvState.ordem; [a[i-1],a[i]]=[a[i],a[i-1]]; render(); }
      }
      else if(action === "atv-order-down"){
        const i = parseInt(el.dataset.i,10);
        const a=atvState.ordem;
        if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; render(); }
      }
      else if(action === "atv-check-somasub"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const r = atv.rodadas[atvState.rodada % atv.rodadas.length];
        atvState.answered = true;
        atvState.totalFeitas += 1;
        if(normalizeNum(atvState.inputValue) === normalizeNum(r.resultado)) atvState.acertos += 1;
        render();
      }
      else if(action === "atv-check-problema"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const r = atv.rodadas[atvState.rodada % atv.rodadas.length];
        atvState.answered = true;
        atvState.totalFeitas += 1;
        if(normalizeNum(atvState.inputValue) === normalizeNum(r.resposta)) atvState.acertos += 1;
        render();
      }
      else if(action === "atv-check-algoritmo"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const r = atv.rodadas[atvState.rodada % atv.rodadas.length];
        atvState.answered = true;
        atvState.totalFeitas += 1;
        const v = atvState.algoritmoVals;
        const certo = normalizeNum(v.linha1)===String(r.linha1) && normalizeNum(v.linha2)===String(r.linha2) && normalizeNum(v.total)===String(r.total);
        if(certo) atvState.acertos += 1;
        render();
      }
      else if(action === "atv-conv-pick"){
        atvState.conversorOpIdx = parseInt(el.dataset.i,10);
        atvState.conversorValue = "";
        render();
      }
      else if(action === "atv-check-solido"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        const s = atv.solidos[atvState.rodada % atv.solidos.length];
        atvState.answered = true;
        atvState.totalFeitas += 1;
        const v = atvState.algoritmoVals;
        const certo = normalizeNum(v.faces)===String(s.faces) && normalizeNum(v.arestas)===String(s.arestas) && normalizeNum(v.vertices)===String(s.vertices);
        if(certo) atvState.acertos += 1;
        render();
      }
    };
  });

  document.querySelectorAll("[data-action-input]").forEach(el=>{
    el.oninput = ()=>{
      const kind = el.dataset.actionInput;
      const val = el.value;
      if(kind === "qvl") atvState.qvlValue = val;
      else if(kind === "somasub") atvState.inputValue = val;
      else if(kind === "problema") atvState.inputValue = val;
      else if(kind === "conversor") atvState.conversorValue = val;
      else if(kind === "algo-linha1") atvState.algoritmoVals.linha1 = val;
      else if(kind === "algo-linha2") atvState.algoritmoVals.linha2 = val;
      else if(kind === "algo-total") atvState.algoritmoVals.total = val;
      else if(kind === "solido-faces") atvState.algoritmoVals.faces = val;
      else if(kind === "solido-arestas") atvState.algoritmoVals.arestas = val;
      else if(kind === "solido-vertices") atvState.algoritmoVals.vertices = val;
      else if(kind === "array-linhas"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        let n = parseInt(val,10); if(isNaN(n)) n = 1;
        atvState.arrayLinhas = Math.max(1, Math.min(atv.maxLinhas, n));
      }
      else if(kind === "array-colunas"){
        const t = currentStudyTopic();
        const atv = t.atividades[atvState.activeIdx];
        let n = parseInt(val,10); if(isNaN(n)) n = 1;
        atvState.arrayColunas = Math.max(1, Math.min(atv.maxColunas, n));
      }
      // re-render apenas o necessário, preservando foco no input ativo
      const focusedKind = kind;
      render();
      const newEl = document.querySelector(`[data-action-input="${focusedKind}"]`);
      if(newEl){ newEl.focus(); try{ newEl.setSelectionRange(newEl.value.length, newEl.value.length); }catch(e){} }
    };
  });
}

/* ---------------- INIT ---------------- */
render();

</script>
</body>
</html>
